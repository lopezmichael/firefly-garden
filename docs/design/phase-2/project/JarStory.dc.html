<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Firefly Garden · firefly jar storyboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap">
<style>
body{margin:0;background:#0C1A22}
</style>
</helmet>
<div style="width: 1240px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #0C1A22 0%, #13252C 55%, #2A1B26 100%); color: #F3EEDC; font-family: 'Nunito', system-ui, sans-serif; padding: 36px 40px; display: flex; flex-direction: column; gap: 22px">

  <div style="display: flex; justify-content: space-between; align-items: baseline">
    <h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 30px; color: #FFE7A3">Releasing a firefly</h1>
    <span style="font-size: 15px; color: #B3C6BD">Tap a tile: the jar opens and one firefly flies out to it. About 0.9 s from tap to landing.</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px">
    <sc-for list="{{frames}}" as="f" hint-placeholder-count="4">
      <div style="background: rgba(27,44,48,0.9); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
        <div style="position: relative; width: 250px; height: 190px">
        <svg width="250" height="190" viewBox="0 0 250 190" role="img" aria-label="{{f.alt}}" style="position: absolute; inset: 0">
          <rect x="150" y="20" width="62" height="62" rx="15" fill="{{f.tileFill}}"></rect>
          <rect x="150" y="76" width="62" height="7" rx="3" fill="{{f.tileEdge}}"></rect>
          <rect x="146" y="16" width="70" height="70" rx="18" fill="none" stroke="#FFE7A3" stroke-width="2" stroke-dasharray="5 5" opacity="{{f.ring}}"></rect>
          <path d="M60 118 Q 120 0 181 50" fill="none" stroke="#FFE7A3" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round" opacity="{{f.trail}}"></path>
          <g transform="translate(28 96)">
            <ellipse cx="32" cy="50" rx="34" ry="34" fill="#FFE7A3" opacity="{{f.glow}}"></ellipse>
            <path d="M18 18 h28 v6 c8 4 12 12 12 22 v18 c0 8 -6 13 -14 13 h-24 c-8 0 -14 -5 -14 -13 v-18 c0 -10 4 -18 12 -22 z" fill="#CDE6DF" fill-opacity="0.16" stroke="#CDE6DF" stroke-opacity="0.75" stroke-width="2"></path>
            <g transform="{{f.lid}}">
              <rect x="16" y="9" width="32" height="10" rx="3" fill="#B8862B"></rect>
              <rect x="16" y="9" width="32" height="4" rx="2" fill="#D9A54A"></rect>
            </g>
          </g>
          <g transform="{{f.fly}}" opacity="{{f.flyOn}}">
            <circle cx="0" cy="0" r="16" fill="#FFE7A3" fill-opacity="0.35"></circle>
            <ellipse cx="-6" cy="-7" rx="6" ry="4" fill="#FFFFFF" fill-opacity="0.85" transform="rotate(-25 -6 -7)"></ellipse>
            <ellipse cx="6" cy="-7" rx="6" ry="4" fill="#FFFFFF" fill-opacity="0.85" transform="rotate(25 6 -7)"></ellipse>
            <circle cx="0" cy="2" r="6.5" fill="#FFF3C4" stroke="#7A5413" stroke-width="1.2"></circle>
            <circle cx="0" cy="-5" r="3.4" fill="#3A2E1A"></circle>
          </g>
          <text x="98" y="182" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="15" fill="#B3C6BD">{{f.count}}</text>
        </svg>
        <sc-for list="{{f.inside}}" as="d" hint-placeholder-count="4">
          <span aria-hidden="true" style="position: absolute; left: {{d.l}}px; top: {{d.t}}px; width: 8px; height: 8px; border-radius: 999px; background: #FFF3C4; box-shadow: 0 0 8px 4px rgba(255,231,163,0.45)"></span>
        </sc-for>
        </div>
        <div style="display: flex; gap: 8px; align-items: baseline">
          <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 18px; color: #F2C66D">{{f.step}}</span>
          <span style="font-weight: 800; font-size: 16px">{{f.title}}</span>
          <span style="margin-left: auto; font-size: 13px; color: #B3C6BD">{{f.time}}</span>
        </div>
        <span style="font-size: 14px; line-height: 1.4; color: #CDD8CF">{{f.text}}</span>
      </div>
    </sc-for>
  </div>

  <div style="display: grid; grid-template-columns: 1.35fr 1fr; gap: 18px; flex: 1; min-height: 0">
    <div style="background: rgba(27,44,48,0.9); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font-size: 18px; font-weight: 800">Jar states</h2>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 18px">
        <sc-for list="{{states}}" as="s" hint-placeholder-count="6">
          <div style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-weight: 800; font-size: 15px; color: {{s.color}}">{{s.name}}</span>
            <span style="font-size: 14px; line-height: 1.4; color: #CDD8CF">{{s.text}}</span>
          </div>
        </sc-for>
      </div>
    </div>
    <div style="background: rgba(27,44,48,0.9); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: inset 0 0 0 2px #F2C66D">
      <h2 style="margin: 0; font-size: 18px; font-weight: 800; color: #FFE7A3">Decisions for Michael</h2>
      <sc-for list="{{decisions}}" as="d" hint-placeholder-count="2">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-weight: 800; font-size: 15px">{{d.q}}</span>
          <span style="font-size: 14px; line-height: 1.45; color: #CDD8CF">{{d.a}}</span>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1240,"height":844}}'>
var SLOTS = [[24, 62], [40, 64], [32, 52], [20, 47], [44, 48]];
function inside(n) { return SLOTS.slice(0, n).map(function (p, i) { return { key: String(i), l: 28 + p[0] - 4, t: 96 + p[1] - 4 }; }); }
var DARK = "#20403A", DARK_EDGE = "#11241F", LIT = "#F5CD74", LIT_EDGE = "#A9782A";
class Component extends DCLogic {
  renderVals() {
    return {
      frames: [
        { key: "1", step: "1", title: "Tap", time: "0 ms", text: "The tile answers at once with a soft ring, so the tap never feels lost while the firefly is still on its way.",
          alt: "A ring appears on the tapped tile; the jar is closed with 5 fireflies.", tileFill: DARK, tileEdge: DARK_EDGE, ring: "1", trail: "0", glow: "0.25",
          inside: inside(5), lid: "translate(0 0)", fly: "translate(0 0)", flyOn: "0", count: "5 of 5 in the jar" },
        { key: "2", step: "2", title: "Lid lifts", time: "0 to 150 ms", text: "The cork tips back and one firefly rises out of the jar. The badge drops to 4 right away.",
          alt: "The jar lid tips open and a firefly rises from the jar.", tileFill: DARK, tileEdge: DARK_EDGE, ring: "1", trail: "0", glow: "0.3",
          inside: inside(4), lid: "translate(-3 -9) rotate(-22 18 16)", fly: "translate(60 92)", flyOn: "1", count: "4 of 5 in the jar" },
        { key: "3", step: "3", title: "Flight", time: "150 to 700 ms", text: "It arcs over the board to the tile along a gentle curve, wings fluttering. The lid settles back.",
          alt: "The firefly arcs through the air toward the tile.", tileFill: DARK, tileEdge: DARK_EDGE, ring: "0.6", trail: "0.8", glow: "0.25",
          inside: inside(4), lid: "translate(0 0)", fly: "translate(128 24)", flyOn: "1", count: "4 of 5 in the jar" },
        { key: "4", step: "4", title: "Landing", time: "700 to 900 ms", text: "The usual drop-and-bounce, then the light ripples out along the row and column. Sound: the placement chime on landing, not on tap.",
          alt: "The firefly lands on the tile, which lights up gold.", tileFill: LIT, tileEdge: LIT_EDGE, ring: "0", trail: "0", glow: "0.25",
          inside: inside(4), lid: "translate(0 0)", fly: "translate(181 46)", flyOn: "1", count: "4 of 5 in the jar" }
      ],
      states: [
        { key: "a", name: "Full", color: "#F3EEDC", text: "Every firefly the garden needs, glowing in the jar. The badge shows the count left." },
        { key: "b", name: "Calling one back", color: "#F3EEDC", text: "Tap a placed firefly: it flies home along the same arc and the count goes up." },
        { key: "c", name: "Hint", color: "#F2C66D", text: "A gold firefly leaves the jar for the hinted tile and stays locked there. It still comes out of the same jar." },
        { key: "d", name: "Empty, garden not glowing", color: "#F3EEDC", text: "“Every firefly is out. Call one back and try another spot.”" },
        { key: "e", name: "Empty tap", color: "#FFB4B4", text: "Tapping a dark tile with an empty jar: the jar gives a small shake and says it is empty. Nothing is placed." },
        { key: "f", name: "Reduced motion", color: "#F3EEDC", text: "No flight or lid: the firefly appears on the tile and the count changes. Same state, same sound." }
      ],
      decisions: [
        { key: "1", q: "1. Can a player place more fireflies than the jar holds?", a: "Recommended: no. The jar caps it, which matches the metaphor and turns “too many” into a clear moment (the empty-jar shake) instead of a puzzling dead end. Grading already assumes players know the count, so the cap adds no hidden difficulty." },
        { key: "2", q: "2. Where does the jar live?", a: "Proposed: in the status card, replacing the lit-tiles bar (both critiques found the bar repeats the “tiles still dark” line). The flight then starts below the board and rises to it. Alternative: the top bar next to the coins, where flights drop down instead. Both change the locked layout, so this needs your call." }
      ]
    };
  }
}
</script>
</body>
</html>
